const N = DATA.nodes, L = DATA.links, C = DATA.communities;
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W, H, DPR;
function resize(){ DPR = Math.min(devicePixelRatio||1, 2); W = innerWidth; H = innerHeight;
  cv.width = W*DPR; cv.height = H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0); }
addEventListener('resize', resize); resize();

// ---- palette per community (hue spread, cool base) ----
const hueOf = i => (200 + i * 137.5) % 360;
const col = (i, a=1, l=62) => `hsla(${hueOf(i)},78%,${l}%,${a})`;

// ---- force layout (precomputed, then gentle drift) ----
const P = N.map((n,i)=>{ const a = i*2.399, r = 220 + Math.sqrt(i)*18;
  return { x: Math.cos(a)*r, y: Math.sin(a)*r, vx:0, vy:0, deg:n[2], c:n[1], doc:n[3], lbl:n[0], ph: Math.random()*6.283 }; });
const adj = N.map(()=>[]); L.forEach(([a,b])=>{ adj[a].push(b); adj[b].push(a); });
const cCenter = C.map((_,i)=>{ const a = i/C.length*6.283; return [Math.cos(a)*420, Math.sin(a)*420]; });
function step(k){
  for (let i=0;i<P.length;i++){ const p=P[i];
    for (let j=i+1;j<P.length;j++){ const q=P[j]; let dx=p.x-q.x, dy=p.y-q.y, d2=dx*dx+dy*dy+4;
      if (d2>250000) continue; const f = 900/d2; dx*=f; dy*=f; p.vx+=dx; p.vy+=dy; q.vx-=dx; q.vy-=dy; }
    const cc = cCenter[p.c]; p.vx += (cc[0]-p.x)*0.004; p.vy += (cc[1]-p.y)*0.004;
    p.vx -= p.x*0.0015; p.vy -= p.y*0.0015; }
  for (const [a,b] of L){ const p=P[a], q=P[b]; const dx=q.x-p.x, dy=q.y-p.y, d=Math.hypot(dx,dy)||1;
    const f = (d-70)*0.01; p.vx+=dx/d*f; p.vy+=dy/d*f; q.vx-=dx/d*f; q.vy-=dy/d*f; }
  for (const p of P){ p.x+=p.vx*k; p.y+=p.vy*k; p.vx*=0.6; p.vy*=0.6; }
}
for (let t=0;t<260;t++) step(1);
P.forEach(p=>{ p.hx=p.x; p.hy=p.y; });

// ---- particles travelling along edges ----
const parts = []; for (let i=0;i<Math.min(320, L.length);i++) parts.push({ e:(i*7)%L.length, t:Math.random(), s:0.002+Math.random()*0.005 });

let mx=0, my=0, tmx=0, tmy=0, paused=false, T=0, focusI=-1, focusT=0;
addEventListener('mousemove', e=>{ tmx=(e.clientX/W-0.5); tmy=(e.clientY/H-0.5); });
addEventListener('keydown', e=>{ if (e.key===' ') paused=!paused;
  if (e.key==='f'||e.key==='F') document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); });
document.getElementById('stats').innerHTML = `<b>${N.length}</b> nodos · <b>${L.length}</b> aristas · <b>${C.length}</b> comunidades`;
const hubs = P.map((p,i)=>i).sort((a,b)=>P[b].deg-P[a].deg).slice(0,24);

function frame(){
  requestAnimationFrame(frame); if (paused) return;
  T += reduced ? 0 : 0.016; mx += (tmx-mx)*0.05; my += (tmy-my)*0.05;
  if (!reduced) for (const p of P){ p.x = p.hx + Math.sin(T*0.6+p.ph)*4; p.y = p.hy + Math.cos(T*0.5+p.ph*1.3)*4; }
  const rot = reduced ? 0 : T*0.04, cs=Math.cos(rot), sn=Math.sin(rot);
  const zoom = 0.22 + Math.sin(T*0.12)*0.03 + Math.min(W,H)/2600;
  const sx = p => W/2 + (p.x*cs - p.y*sn)*zoom - mx*60, sy = p => H/2 + (p.x*sn + p.y*cs)*zoom - my*60;

  ctx.fillStyle = 'rgba(7,10,18,0.35)'; ctx.fillRect(0,0,W,H);      // trails
  // edges
  ctx.lineWidth = 0.6;
  for (const [a,b] of L){ const p=P[a], q=P[b];
    ctx.strokeStyle = col(p.c, 0.13, 60); ctx.beginPath(); ctx.moveTo(sx(p),sy(p)); ctx.lineTo(sx(q),sy(q)); ctx.stroke(); }
  // particles
  for (const pt of parts){ pt.t += pt.s; if (pt.t>1){ pt.t=0; pt.e=(pt.e+13)%L.length; }
    const [a,b]=L[pt.e], p=P[a], q=P[b]; const x=sx(p)+(sx(q)-sx(p))*pt.t, y=sy(p)+(sy(q)-sy(p))*pt.t;
    ctx.fillStyle = col(p.c, 0.9, 75); ctx.beginPath(); ctx.arc(x,y,1.4,0,6.283); ctx.fill(); }
  // nodes
  for (let i=0;i<P.length;i++){ const p=P[i]; const r = 1.2 + Math.sqrt(p.deg)*1.1;
    const x=sx(p), y=sy(p), pulse = 1 + (reduced?0:Math.sin(T*2+p.ph)*0.12);
    if (p.deg>6){ const g = ctx.createRadialGradient(x,y,0,x,y,r*5); g.addColorStop(0,col(p.c,0.35,65)); g.addColorStop(1,col(p.c,0,65));
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,r*5*pulse,0,6.283); ctx.fill(); }
    ctx.fillStyle = p.doc ? col(p.c,0.85,80) : col(p.c,0.95,62);
    ctx.beginPath(); ctx.arc(x,y,r*pulse,0,6.283); ctx.fill(); }
  // hub labels
  ctx.font = '11px "SF Mono", Menlo, monospace'; ctx.textBaseline='middle';
  for (const i of hubs){ const p=P[i]; ctx.fillStyle='rgba(223,230,242,0.75)'; ctx.fillText(p.lbl, sx(p)+8+Math.sqrt(p.deg), sy(p)); }
  // rotating focus on hubs
  if (T-focusT > 4 || focusI<0){ focusT=T; focusI = hubs[Math.floor(Math.random()*hubs.length)];
    document.getElementById('flbl').textContent = P[focusI].lbl; document.getElementById('fcom').textContent = C[P[focusI].c]; }
  const f=P[focusI], fx=sx(f), fy=sy(f), rr = 14 + Math.sin(T*3)*3;
  ctx.strokeStyle = col(f.c,0.9,70); ctx.lineWidth=1.2; ctx.beginPath(); ctx.arc(fx,fy,rr,0,6.283); ctx.stroke();
  ctx.strokeStyle = col(f.c,0.5,70); ctx.lineWidth=1.5;
  for (const j of adj[focusI]){ ctx.beginPath(); ctx.moveTo(fx,fy); ctx.lineTo(sx(P[j]),sy(P[j])); ctx.stroke(); }
}
ctx.fillStyle='#070a12'; ctx.fillRect(0,0,W,H); frame();
